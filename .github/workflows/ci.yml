name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      - name: Install GNU Octave (MATLAB cross-check)
        if: matrix.python == '3.13'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends octave
      - run: python -m unittest discover tests -v
      - name: Every project manifest is valid
        run: for p in projects/*/; do python -m mtdi check "$p"; done
      - name: The committed website (site/dist, served by Vercel) is current
        if: matrix.python == '3.13'
        run: |
          python -m mtdi site build
          git status --porcelain site/dist
          test -z "$(git status --porcelain site/dist)" || (echo "Run: python -m mtdi site build, then commit site/dist" && exit 1)
