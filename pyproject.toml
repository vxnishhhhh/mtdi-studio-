[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mtdi-studio"
version = "5.0.0"
description = "MTDI 5.0: Microprocessing Technological Diagnostic Intelligence"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Vaishnav" }]
keywords = ["diagnostics", "sensors", "raspberry-pi", "monitoring", "anomaly-detection"]
dependencies = []

[project.optional-dependencies]
ui = ["dash>=2.17", "flask>=3"]
serial = ["pyserial>=3.5"]
all = ["dash>=2.17", "flask>=3", "pyserial>=3.5"]

[project.scripts]
mtdi = "mtdi.__main__:main"

[tool.setuptools.packages.find]
include = ["mtdi*"]

[tool.setuptools.package-data]
"mtdi.pillars.i3" = ["assets/*", "examples/*.json", "README.md"]
